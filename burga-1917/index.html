<style>
/* Layout: a short memorial header, then the eleven men as service cards (boletins individuais) in a grid; field labels printed, data "typed". */
:root{
  --sea:#DCE3E3; --land:#E9E2CF;
  --paper:#F3EEE2; --card:#FBF8F0; --ink:#2B2A26; --muted:#6B675C; --rule:#D6CFBD;
  --khaki:#5E6B3F; --stamp:#9C2F23; --blue:#244C7A; --fam:#E7EBDA;
  --display:"Alegreya SC", "Iowan Old Style", Georgia, serif;
  --body:"Alegreya", "Iowan Old Style", Georgia, serif;
  --typed:"Courier Prime", "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1B1C17; --card:#24251F; --ink:#ECE7DA; --muted:#A8A393; --rule:#3B3C33;
  --khaki:#A9B87F; --stamp:#E0806F; --blue:#8DB4E2; --fam:#2D3324; --sea:#1F2A2E; --land:#2C2D25; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1C17; --card:#24251F; --ink:#ECE7DA; --muted:#A8A393; --rule:#3B3C33;
  --khaki:#A9B87F; --stamp:#E0806F; --blue:#8DB4E2; --fam:#2D3324; --sea:#1F2A2E; --land:#2C2D25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lang{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.lang button{font:600 14px var(--display);letter-spacing:.06em;border:1.5px solid var(--khaki);background:transparent;color:var(--khaki);padding:5px 12px;border-radius:3px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--khaki);color:var(--card)}
.lang button:focus-visible,.share button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header{margin:18px 0 28px;max-width:46rem}
.eyebrow{font:500 14px var(--display);letter-spacing:.14em;color:var(--stamp);margin:0}
h1{font:700 clamp(30px,6vw,52px)/1.05 var(--display);margin:6px 0 14px;text-wrap:balance;letter-spacing:.01em}
.lead{font-size:19px;margin:0 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin:16px 0 0;padding:0;list-style:none;font:15px var(--typed);color:var(--muted)}
.facts b{color:var(--ink);font-size:20px;margin-right:4px}
.legend{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);margin:22px 0 14px}
.legend i{width:18px;height:12px;background:var(--fam);border:1px solid var(--khaki);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.card.fam{background:var(--fam);border-color:var(--khaki)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:12px var(--display);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.card h2{font:700 21px/1.2 var(--body);margin:2px 0 0;text-wrap:balance}
.born{font:15px var(--typed);color:var(--muted);margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:4px 0 0;font-size:15px}
dt{font:500 13px var(--display);letter-spacing:.06em;color:var(--muted);padding-top:2px}
dd{margin:0;font-family:var(--typed);font-size:14.5px;color:var(--blue);min-width:0;overflow-wrap:anywhere}
.fate{font-size:15.5px;margin:4px 0 0}
.pow{display:inline-block;font:700 12px var(--display);letter-spacing:.1em;color:var(--stamp);border:1.5px solid var(--stamp);padding:1px 7px;border-radius:2px;transform:rotate(-2deg);margin-bottom:4px}
.rel{font-size:15px;border-top:1px dashed var(--rule);padding-top:8px;margin-top:auto}
.card.fam .rel{border-top-color:var(--khaki)}
.rel b{color:var(--khaki)}
.ref{font:12px var(--typed);color:var(--muted)}
section.notes{max-width:46rem;margin-top:36px;font-size:16px}
section.notes h3{font:700 18px var(--display);letter-spacing:.06em;margin:22px 0 6px}
section.notes p{margin:0 0 10px}
section.notes a{color:var(--blue)}
.reading{margin:0 0 10px;padding-left:1.2em}
.reading li{margin:0 0 6px}
#p-more{background:var(--fam);border-left:3px solid var(--khaki);padding:10px 14px}
.share{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:15px;color:var(--muted)}
.share button{font:600 14px var(--display);letter-spacing:.06em;border:1.5px solid var(--blue);background:transparent;color:var(--blue);padding:5px 12px;border-radius:3px;cursor:pointer}
.role{font-size:15px;margin:2px 0 0;color:var(--ink)}
.role b{font:500 13px var(--display);letter-spacing:.06em;color:var(--muted);margin-right:4px}
section.story{max-width:46rem;margin-top:44px}
section.story>h2{font:700 clamp(24px,4.5vw,34px)/1.1 var(--display);margin:0 0 10px;text-wrap:balance}
section.story .intro{color:var(--muted);margin:0 0 14px}
.toc{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 22px}
.toc a{font:500 13px var(--display);letter-spacing:.05em;color:var(--khaki);text-decoration:none;border:1px solid var(--rule);padding:3px 9px;border-radius:2px;background:var(--card)}
.toc a:hover,.toc a:focus-visible{border-color:var(--khaki)}
.chap{display:grid;grid-template-columns:5.5rem 1fr;gap:4px 18px;padding:16px 0;border-top:1px solid var(--rule)}
.chap .when{font:13px/1.4 var(--typed);color:var(--stamp);padding-top:4px}
.chap h3{font:700 19px/1.25 var(--body);margin:0 0 6px;text-wrap:balance}
.chap p{margin:0 0 8px;min-width:0}
.chap .burga{background:var(--fam);border-left:3px solid var(--khaki);padding:8px 12px;font-size:15.5px;margin:6px 0 0}
.chap>div{min-width:0}
@media (max-width:560px){.chap{grid-template-columns:1fr}.chap .when{padding-top:0}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
figure.ph{margin:12px 0 4px;min-width:0}
figure.ph img{display:block;width:100%;height:auto;border:1px solid var(--rule);background:var(--card)}
figure.ph figcaption{font-size:14.5px;color:var(--muted);margin-top:5px;line-height:1.4}
figure.ph figcaption a{color:var(--muted);font:12px var(--typed);white-space:nowrap}
.phs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:4px 12px}
section.journey,section.battles,section.honours{max-width:46rem;margin-top:44px}
section.journey>h2,section.battles>h2,section.honours>h2{font:700 clamp(24px,4.5vw,34px)/1.1 var(--display);margin:0 0 10px;text-wrap:balance}
section.journey .intro,section.battles .intro{color:var(--muted);margin:0 0 14px}
svg.map{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:2px}
.map .sea{fill:var(--sea)} .map .land{fill:var(--land);stroke:var(--rule);stroke-width:.7}
.map path[class^="r-"]{fill:none;stroke-linecap:round;stroke-linejoin:round}
.map .r-out{stroke:var(--blue);stroke-width:2.5}
.map .r-sea{stroke:var(--blue);stroke-width:2.5;stroke-dasharray:6 5}
.map .r-front{stroke:var(--khaki);stroke-width:5}
.map .r-pow{stroke:var(--stamp);stroke-width:2.5;stroke-dasharray:3 4}
.map .r-ret{stroke:var(--muted);stroke-width:2;stroke-dasharray:8 4 2 4}
.map circle{fill:var(--ink)} .map circle.big{fill:var(--khaki)} .map circle.camp{fill:var(--stamp)}
.map text{font:500 12px var(--display);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;letter-spacing:.03em}
.map text.b{font-size:13.5px;font-weight:700}
.mapkey{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;padding:0;margin:10px 0 0;font-size:14.5px;color:var(--muted)}
.mapkey i{display:inline-block;width:26px;height:0;border-top-width:3px;vertical-align:middle;margin-right:6px}
ol.bat{list-style:none;padding:0;margin:0}
ol.bat li{display:grid;grid-template-columns:7.5rem 1fr;gap:4px 18px;padding:14px 0;border-top:1px solid var(--rule)}
ol.bat li>div{min-width:0}
ol.bat .when{font:13px/1.4 var(--typed);color:var(--stamp);padding-top:4px}
ol.bat h3{font:700 18px/1.25 var(--body);margin:0 0 4px;text-wrap:balance}
ol.bat p{margin:0 0 6px}
ol.bat .burga,.hon .burga{background:var(--fam);border-left:3px solid var(--khaki);padding:8px 12px;font-size:15.5px;margin:6px 0 0}
@media (max-width:560px){ol.bat li{grid-template-columns:1fr}}
.hon h3{font:700 19px/1.25 var(--body);margin:20px 0 6px}
.hon p{margin:0 0 10px}

const STORY={
pt:{h:"Da Burga à Flandres, e de volta",intro:"O que viveram estes homens, contado a partir da história do Corpo Expedicionário Português. Os boletins dizem onde estiveram; o resto é o que se sabe dos soldados das mesmas unidades. As fotografias mostram outros soldados do CEP nos mesmos lugares: não se conhece nenhuma fotografia dos onze.",ch:[
["recruit","1909–1916","O recrutamento","Desde a lei de 1911, todos os rapazes eram recenseados aos 20 anos e inspecionados por uma junta; os apurados faziam a recruta e ficavam na reserva. Os onze da Burga, nascidos entre 1889 e 1895, foram assim inscritos no Regimento de Infantaria 10, de Bragança, o regimento da sua região. Quando a Alemanha declarou guerra a Portugal, a 9 de março de 1916, foram chamados de novo para formar o Corpo Expedicionário Português.","Quase todos eram jornaleiros ou lavradores, e a maioria não sabia ler nem escrever."],
["train","1916","A instrução em Portugal","Em 1916 os batalhões foram treinados em Portugal; a grande manobra de Tancos, no verão, ficou conhecida como o «milagre de Tancos» por ter preparado uma divisão em poucos meses. Muitos homens voltaram depois às suas aldeias à espera da ordem de embarque."],
["travel","1917","A viagem até Lisboa","De Bragança, o caminho mais provável era o comboio da linha do Tua, que passava em Macedo de Cavaleiros, até ao Douro, e depois pela linha do Douro até ao Porto e daí a Lisboa: para quase todos, a primeira viagem de comboio e a primeira vez na capital."],
["sea","jan.–mai. 1917","O embarque para França","Os contingentes embarcaram em Lisboa em navios britânicos e, a partir de agosto de 1917, portugueses, rumo a Brest, na Bretanha. A primeira brigada partiu a 30 de janeiro de 1917 e chegou a 2 de fevereiro. Eram três ou quatro dias de mar, com enjoo e o medo dos submarinos.","Carolino José partiu a 17 de janeiro de 1917, nos primeiros contingentes; os soldados de Infantaria 10 partiram em abril e maio de 1917."],
["arrive","1917","Chegada e treino na Flandres","De Brest, cerca de três dias de comboio levavam à zona de concentração em redor de Aire-sur-la-Lys e Thérouanne, no Pas-de-Calais. Ali, instrutores britânicos ensinavam a guerra de trincheiras: máscaras de gás, granadas, a metralhadora Lewis, a construção de abrigos. O quartel-general português ficava no castelo de La Morande, em Roquetoire."],
["kit","1917–1918","Equipamento","Os soldados portugueses usavam a farda cinzento-azulada portuguesa, mas em França receberam material britânico: o capacete de aço, a espingarda Lee-Enfield em vez da Mauser-Vergueiro, a metralhadora ligeira Lewis, granadas Mills e a máscara de gás de caixa."],
["life","1917–1918","Alojamento e comida","Fora da linha, ficavam aquartelados em celeiros, estábulos e casas de lavradores das aldeias. A comida seguia o modelo britânico: pão, carne enlatada, bolacha, chá. Os soldados queixavam-se da falta de vinho, de azeite e de bacalhau, e do frio e da lama do inverno da Flandres, muito diferentes de Trás-os-Montes."],
["locals","1917–1918","Os franceses e os britânicos","As relações com a população foram em geral boas: os soldados aprendiam palavras de francês, trabalhavam por vezes nas quintas e alguns casaram em França. Os britânicos, de quem dependiam para quase tudo, alcunharam-nos de «Pork and Beans», um trocadilho com «Portuguese»."],
["letters","1917–1918","Cartas para casa","As cartas seguiam pelo Serviço Postal de Campanha e eram lidas pela censura militar, que riscava nomes de lugares e queixas. Como a maioria dos soldados não sabia escrever, eram muitas vezes os camaradas, os sargentos ou o capelão que escreviam por eles; na aldeia, o padre ou o professor lia-as às famílias. Os prisioneiros só podiam mandar alguns postais da Cruz Vermelha por mês. As cartas que sobreviveram falam sobretudo da vontade de voltar a casa, do frio, da chuva, da lama, dos piolhos, dos ratos e da comida estranha, e da injustiça de os oficiais terem licenças e os soldados não. O tom é de grande fatalismo. Para explicar a guerra, comparavam-na com coisas da terra, como o fogo de artifício das festas, e muitas vezes escondiam o perigo para não assustar as mães.","Não se conhece nenhuma carta dos onze da Burga. Se a sua família guardou cartas ou postais destes homens, são documentos raros."],
["front","mai. 1917 – abr. 1918","Na linha da frente","O CEP ocupava um sector de cerca de 11 km entre Fauquissart, Chapigny, Neuve-Chapelle e Ferme du Bois, sob o comando do I Exército britânico. O CEP era comandado pelo general Tamagnini de Abreu e Silva; a 2.ª Divisão, a que pertencia Infantaria 10 (5.ª Brigada), pelo general Gomes da Costa. Depois do golpe de Sidónio Pais, em dezembro de 1917, deixaram de chegar reforços e licenças, e os homens ficaram meses seguidos nas trincheiras."],
["lys","9 abr. 1918","A Batalha de La Lys","Às 4h15 da madrugada, o 6.º Exército alemão abriu um bombardeamento de mais de quatro horas, com gás, sobre a 2.ª Divisão portuguesa, que estava prestes a ser rendida. No nevoeiro, a infantaria alemã envolveu as trincheiras. Em poucas horas a divisão foi desfeita: cerca de 400 mortos e mais de 6 000 prisioneiros. Nesse dia, Aníbal Milhais, de Murça, também transmontano, ganhou o nome de «Soldado Milhões».","Faustino dos Santos Costa e Francisco António, de Infantaria 10, e Cândido José Ludovino, telegrafista, foram dados como desaparecidos e feitos prisioneiros."],
["camp","abr. – nov. 1918","O cativeiro","Os prisioneiros foram levados a pé e de comboio para campos na Alemanha, como Rastatt, Breesen e Friedrichsfeld, perto de Wesel. Passavam fome: a ração era pouca e as encomendas da Cruz Vermelha chegavam tarde; muitos perderam muito peso e foram postos a trabalhar no campo e em obras.","Faustino e Francisco António, ambos da 4.ª companhia, constam da mesma lista da Cruz Vermelha e foram levados para Friedrichsfeld, perto de Wesel."],
["end","abr. – nov. 1918","Até ao armistício","Os que escaparam continuaram em França em unidades reorganizadas, muitas vezes a trabalhar para os britânicos, e alguns batalhões voltaram à frente no outono de 1918, no avanço final. O armistício foi assinado a 11 de novembro de 1918.","Felisberto passou a Infantaria 23 a 31 de outubro de 1918."],
["home","jan. – ago. 1919","O regresso","Os prisioneiros, libertados depois do armistício, chegaram a Lisboa em janeiro de 1919; os restantes regressaram por etapas ao longo de 1919. Não foram dias de festa: os navios chegavam sem data certa, por causa dos submarinos, e depois da derrota de La Lys o governo preferia esquecer o CEP. Sidónio Pais ainda recebeu os primeiros no cais, mas foi assassinado em dezembro de 1918. Em Trás-os-Montes, a gripe pneumónica tinha acabado de matar muita gente no outono de 1918, e em janeiro e fevereiro de 1919 a revolta monárquica da «Monarquia do Norte» dominou o Norte do país. Foi nesse ambiente que os homens apanharam o comboio de volta. Na aldeia, é provável que tenha havido missas de ação de graças e promessas cumpridas pelas mães, como era costume, mas nada ficou escrito sobre a Burga.","Os boletins dão o regresso dos onze entre outubro de 1918 e agosto de 1919."],
["after","depois de 1919","Depois da guerra","Os combatentes voltaram ao trabalho da terra num país pobre e instável. Receberam a medalha comemorativa «França 1917–1918» e a Medalha da Vitória, e muitos inscreveram-se na Liga dos Combatentes, fundada em 1923. Alguns ficaram marcados pelo gás, pela fome do cativeiro ou pelo que tinham visto. Muitos emigraram.","Manuel António partiu para o Rio de Janeiro; Cândido José Ludovino morreu em Alcobaça em 1964 e Francisco António Mendes em Macedo de Cavaleiros no mesmo ano."]
]},
fr:{h:"De Burga aux Flandres, et retour",intro:"Ce qu'ont vécu ces hommes, d'après l'histoire du Corps expéditionnaire portugais. Leurs fiches disent où ils étaient ; le reste est ce que l'on sait des soldats des mêmes unités. Les photographies montrent d’autres soldats du CEP aux mêmes endroits : on ne connaît aucune photo des onze.",ch:[
["recruit","1909–1916","Le recrutement","Depuis la loi de 1911, chaque jeune homme était recensé à 20 ans et examiné par un conseil de révision ; les hommes jugés aptes faisaient leurs classes puis passaient dans la réserve. Les onze de Burga, nés entre 1889 et 1895, furent ainsi inscrits au 10ᵉ régiment d'infanterie de Bragança, le régiment de leur région. Quand l'Allemagne déclara la guerre au Portugal, le 9 mars 1916, ils furent rappelés pour former le Corps expéditionnaire portugais.","Presque tous étaient journaliers ou petits paysans, et la plupart ne savaient ni lire ni écrire."],
["train","1916","L'instruction au Portugal","En 1916, les bataillons furent entraînés au Portugal ; les grandes manœuvres de Tancos, l'été, furent appelées le « miracle de Tancos » pour avoir formé une division en quelques mois. Beaucoup d'hommes rentrèrent ensuite au village en attendant l'ordre d'embarquer."],
["travel","1917","Le voyage jusqu'à Lisbonne","Depuis Bragança, le chemin le plus probable était le train de la ligne du Tua, qui passait par Macedo de Cavaleiros, jusqu'au Douro, puis la ligne du Douro jusqu'à Porto, et de là Lisbonne : pour presque tous, le premier voyage en train et la première fois dans la capitale."],
["sea","janv.–mai 1917","L'embarquement pour la France","Les contingents embarquèrent à Lisbonne sur des navires britanniques puis, à partir d'août 1917, portugais, à destination de Brest. La première brigade partit le 30 janvier 1917 et arriva le 2 février. Trois ou quatre jours de mer, avec le mal de mer et la peur des sous-marins.","Carolino José partit le 17 janvier 1917, parmi les premiers ; les soldats du 10ᵉ d'infanterie partirent en avril et mai 1917."],
["arrive","1917","Arrivée et entraînement en Flandre","De Brest, environ trois jours de train menaient à la zone de rassemblement autour d'Aire-sur-la-Lys et de Thérouanne, dans le Pas-de-Calais. Des instructeurs britanniques y enseignaient la guerre des tranchées : masques à gaz, grenades, mitrailleuse Lewis, construction d'abris. Le quartier général portugais était au château de La Morande, à Roquetoire."],
["kit","1917–1918","L'équipement","Les Portugais gardaient leur uniforme gris-bleu, mais reçurent en France du matériel britannique : le casque d'acier, le fusil Lee-Enfield à la place du Mauser-Vergueiro, la mitrailleuse légère Lewis, les grenades Mills et le masque à gaz à boîte filtrante."],
["life","1917–1918","Logement et nourriture","Hors de la ligne, ils logeaient dans les granges, les étables et les maisons des fermiers des villages. La nourriture suivait le modèle britannique : pain, viande en conserve, biscuits, thé. Les soldats se plaignaient du manque de vin, d'huile d'olive et de morue, et du froid et de la boue de l'hiver flamand, si différents de leur Trás-os-Montes."],
["locals","1917–1918","Les Français et les Britanniques","Les relations avec la population furent en général bonnes : les soldats apprenaient des mots de français, aidaient parfois aux travaux des fermes, et certains se marièrent en France. Les Britanniques, dont ils dépendaient pour presque tout, les surnommaient « Pork and Beans », un jeu de mots sur « Portuguese »."],
["letters","1917–1918","Lettres à la famille","Le courrier passait par la poste de campagne et était lu par la censure militaire, qui rayait noms de lieux et plaintes. Comme la plupart des soldats ne savaient pas écrire, c’étaient souvent les camarades, les sergents ou l’aumônier qui écrivaient pour eux ; au village, le curé ou l’instituteur lisait les lettres aux familles. Les prisonniers ne pouvaient envoyer que quelques cartes de la Croix-Rouge par mois. Les lettres conservées parlent surtout de l’envie de rentrer, du froid, de la pluie, de la boue, des poux, des rats et d’une nourriture étrangère, et de l’injustice des permissions accordées aux officiers mais pas aux soldats. Le ton est d’un grand fatalisme. Pour expliquer la guerre, ils la comparaient à des choses du pays, comme les feux d’artifice des fêtes, et cachaient souvent le danger pour ne pas effrayer leurs mères.","On ne connaît aucune lettre des onze de Burga. Si votre famille a gardé des lettres ou des cartes de ces hommes, ce sont des documents rares."],
["front","mai 1917 – avr. 1918","En première ligne","Le CEP tenait un secteur d'environ 11 km entre Fauquissart, Chapigny, Neuve-Chapelle et la Ferme du Bois, sous les ordres de la 1ʳᵉ armée britannique. Le CEP était commandé par le général Tamagnini de Abreu e Silva ; la 2ᵉ division, dont faisait partie le 10ᵉ d'infanterie (5ᵉ brigade), par le général Gomes da Costa. Après le coup d'État de Sidónio Pais en décembre 1917, renforts et permissions cessèrent, et les hommes restèrent des mois d'affilée dans les tranchées."],
["lys","9 avr. 1918","La bataille de la Lys","À 4 h 15, la 6ᵉ armée allemande ouvrit un bombardement de plus de quatre heures, avec des gaz, sur la 2ᵉ division portugaise, qui devait être relevée ce jour-là. Dans le brouillard, l'infanterie allemande encercla les tranchées. En quelques heures la division fut disloquée : environ 400 morts et plus de 6 000 prisonniers. Ce jour-là, Aníbal Milhais, de Murça, lui aussi du Trás-os-Montes, devint le « soldat Millions ».","Faustino dos Santos Costa et Francisco António, du 10ᵉ d'infanterie, et le télégraphiste Cândido José Ludovino furent portés disparus et faits prisonniers."],
["camp","avr. – nov. 1918","La captivité","Les prisonniers furent emmenés à pied et en train vers des camps en Allemagne, comme Rastatt, Breesen et Friedrichsfeld, près de Wesel. Ils souffraient de la faim : les rations étaient maigres et les colis de la Croix-Rouge arrivaient tard ; beaucoup maigrirent fortement et furent mis au travail dans les champs et sur des chantiers.","Faustino et Francisco António, tous deux de la 4ᵉ compagnie, figurent sur la même liste de la Croix-Rouge et furent envoyés à Friedrichsfeld, près de Wesel."],
["end","avr. – nov. 1918","Jusqu'à l'armistice","Ceux qui avaient échappé restèrent en France dans des unités réorganisées, souvent employées aux travaux pour les Britanniques, et quelques bataillons retournèrent au front à l'automne 1918, pendant l'avance finale. L'armistice fut signé le 11 novembre 1918.","Felisberto passa au 23ᵉ d'infanterie le 31 octobre 1918."],
["home","janv. – août 1919","Le retour","Les prisonniers, libérés après l’armistice, arrivèrent à Lisbonne en janvier 1919 ; les autres rentrèrent par étapes au cours de 1919. Ce ne furent pas des jours de fête : les navires arrivaient sans date fixe à cause des sous-marins, et après la défaite de la Lys le gouvernement préférait oublier le CEP. Sidónio Pais accueillit encore les premiers sur le quai, mais il fut assassiné en décembre 1918. Dans le Trás-os-Montes, la grippe espagnole venait de faire de nombreux morts à l’automne 1918, et en janvier-février 1919 la révolte royaliste de la « Monarchie du Nord » tenait le nord du pays. C’est dans ce climat que les hommes reprirent le train. Au village, il y eut sans doute des messes d’action de grâce et des vœux accomplis par les mères, comme le voulait la coutume, mais rien n’a été écrit sur Burga.","Les fiches datent le retour des onze entre octobre 1918 et août 1919."],
["after","après 1919","Après la guerre","Les anciens combattants retournèrent aux champs dans un pays pauvre et instable. Ils reçurent la médaille commémorative « France 1917–1918 » et la médaille interalliée de la Victoire, et beaucoup adhérèrent à la Ligue des combattants, fondée en 1923. Certains restèrent marqués par les gaz, la faim de la captivité ou ce qu'ils avaient vu. Beaucoup émigrèrent.","Manuel António partit pour Rio de Janeiro ; Cândido José Ludovino mourut à Alcobaça en 1964, et Francisco António Mendes à Macedo de Cavaleiros la même année."]
]},
en:{h:"From Burga to Flanders and back",intro:"What these men lived through, told from the history of the Portuguese Expeditionary Corps. Their cards say where they were; the rest is what is known of the soldiers in the same units. The photographs show other CEP soldiers in the same places: no photograph of the eleven is known.",ch:[
["recruit","1909–1916","Call-up","Under the 1911 law every young man was registered at 20 and examined by a medical board; those found fit did basic training and then passed into the reserve. The eleven Burga men, born between 1889 and 1895, were enrolled in this way in the 10th Infantry Regiment of Bragança, their district's regiment. When Germany declared war on Portugal on 9 March 1916 they were recalled to form the Portuguese Expeditionary Corps.","Nearly all were day labourers or smallholders, and most could not read or write."],
["train","1916","Training in Portugal","In 1916 the battalions trained in Portugal; the great manoeuvres at Tancos that summer became known as the “miracle of Tancos” for readying a division in a few months. Many men then went back to their villages to wait for orders to sail."],
["travel","1917","The journey to Lisbon","From Bragança the likeliest route was the Tua line, which stopped at Macedo de Cavaleiros, down to the Douro, then the Douro line to Porto and on to Lisbon: for almost all of them the first train journey and the first sight of the capital."],
["sea","Jan–May 1917","Sailing for France","The contingents sailed from Lisbon in British ships and, from August 1917, Portuguese ones, bound for Brest in Brittany. The first brigade left on 30 January 1917 and landed on 2 February. It was three or four days at sea, with seasickness and the fear of U-boats.","Carolino José sailed on 17 January 1917, among the first; the 10th Infantry men sailed in April and May 1917."],
["arrive","1917","Arrival and training in Flanders","From Brest, about three days by train brought them to the assembly area around Aire-sur-la-Lys and Thérouanne, in the Pas-de-Calais. British instructors taught trench warfare there: gas masks, grenades, the Lewis gun, building dugouts. Portuguese headquarters was at the Château de La Morande in Roquetoire."],
["kit","1917–1918","Equipment","The Portuguese kept their blue-grey uniform but in France were issued British equipment: the steel helmet, the Lee-Enfield rifle in place of the Mauser-Vergueiro, the Lewis light machine gun, Mills grenades and the box respirator against gas."],
["life","1917–1918","Billets and food","Out of the line they were billeted in barns, stables and farmhouses in the villages. Food followed the British pattern: bread, tinned meat, biscuits, tea. The soldiers complained about the lack of wine, olive oil and salt cod, and about the cold and mud of a Flanders winter, so unlike Trás-os-Montes."],
["locals","1917–1918","The French and the British","Relations with local people were mostly good: soldiers picked up French, sometimes helped on the farms, and some married in France. The British, on whom they depended for almost everything, nicknamed them “Pork and Beans”, a play on “Portuguese”."],
["letters","1917–1918","Letters home","Letters went through the field post and were read by the military censors, who struck out place names and complaints. Since most soldiers could not write, comrades, sergeants or the chaplain often wrote for them, and in the village the priest or the schoolmaster read the letters out to the family. Prisoners could send only a few Red Cross postcards a month. The letters that survive speak above all of wanting to go home, of cold, rain, mud, lice, rats and strange food, and of the unfairness of officers getting leave while soldiers did not. The tone is deeply fatalistic. To explain the war they compared it with things from home, such as the fireworks at village festivals, and often hid the danger so as not to frighten their mothers.","No letter from the Burga eleven is known. If your family kept letters or postcards from these men, they are rare documents."],
["front","May 1917 – Apr 1918","In the line","The CEP held a front of about 11 km between Fauquissart, Chapigny, Neuve-Chapelle and the Ferme du Bois, under the British First Army. The CEP was commanded by General Tamagnini de Abreu e Silva; the 2nd Division, which included the 10th Infantry (5th Brigade), by General Gomes da Costa. After Sidónio Pais's coup in December 1917, reinforcements and leave stopped, and men stayed in the trenches for months on end."],
["lys","9 Apr 1918","The Battle of the Lys","At 4.15 a.m. the German Sixth Army opened a bombardment of more than four hours, with gas, on the Portuguese 2nd Division, which was due to be relieved that day. In the fog, German infantry surrounded the trenches. Within hours the division was broken: about 400 killed and more than 6,000 taken prisoner. That day Aníbal Milhais of Murça, another man from Trás-os-Montes, earned the name “Soldier Millions”.","Faustino dos Santos Costa and Francisco António of the 10th Infantry, and the telegraphist Cândido José Ludovino, were posted missing and taken prisoner."],
["camp","Apr – Nov 1918","Captivity","The prisoners were marched and taken by train to camps in Germany such as Rastatt, Breesen and Friedrichsfeld near Wesel. They went hungry: rations were small and Red Cross parcels arrived late; many lost a great deal of weight and were set to work on farms and building sites.","Faustino and Francisco António, both of the 4th company, are on the same Red Cross list and were sent to Friedrichsfeld, near Wesel."],
["end","Apr – Nov 1918","To the Armistice","Those who escaped stayed in France in reorganised units, often working for the British, and some battalions went back into the line in autumn 1918 for the final advance. The Armistice was signed on 11 November 1918.","Felisberto moved to the 23rd Infantry on 31 October 1918."],
["home","Jan – Aug 1919","Coming home","The prisoners, freed after the Armistice, reached Lisbon in January 1919; the others came back in stages through 1919. These were not days of celebration: ships arrived with no fixed date because of the U-boats, and after the defeat at the Lys the government preferred to forget the CEP. Sidónio Pais welcomed the first men on the quay, but he was assassinated in December 1918. In Trás-os-Montes the Spanish flu had just killed many people in the autumn of 1918, and in January and February 1919 the royalist “Monarchy of the North” revolt held the north of the country. That was the Portugal the men took the train home through. In the village there were probably thanksgiving masses and vows fulfilled by their mothers, as was the custom, but nothing was written down about Burga.","The cards date the eleven men's return between October 1918 and August 1919."],
["after","after 1919","After the war","The veterans went back to the land in a poor and unstable country. They received the commemorative medal “France 1917–1918” and the Inter-Allied Victory Medal, and many joined the Liga dos Combatentes, founded in 1923. Some were marked by gas, by the hunger of captivity or by what they had seen. Many emigrated.","Manuel António left for Rio de Janeiro; Cândido José Ludovino died in Alcobaça in 1964, and Francisco António Mendes in Macedo de Cavaleiros the same year."]
]}};

const PH={"hon":[["vitoria",{"pt":"A Medalha da Vitória portuguesa (1919), desenhada por João da Silva: a Vitória alada na frente, as armas de Portugal no verso.","fr":"La médaille de la Victoire portugaise (1919), dessinée par João da Silva : la Victoire ailée à l’avers, les armes du Portugal au revers.","en":"The Portuguese Victory Medal (1919), designed by João da Silva: winged Victory on the front, the arms of Portugal on the back."},"João Paulo Queiroz · CC BY-SA 4.0"]],"travel": [["alcantara", {"pt": "Um comboio de tropas no cais de Alcântara, Lisboa, 1917.", "fr": "Un train de troupes sur le quai d’Alcântara, Lisbonne, 1917.", "en": "A troop train on the Alcântara quay, Lisbon, 1917."}, "Joshua Benoliel"]], "sea": [["embark", {"pt": "Embarque do CEP no cais de Santa Apolónia, Lisboa, 12 de fevereiro de 1917.", "fr": "Embarquement du CEP, quai de Santa Apolónia, Lisbonne, 12 février 1917.", "en": "CEP troops embarking at the Santa Apolónia quay, Lisbon, 12 February 1917."}, "Joshua Benoliel"]], "arrive": [["brest", {"pt": "Desembarque em Brest: infantaria portuguesa a caminho da estação.", "fr": "Débarquement à Brest : l’infanterie portugaise se rend à la gare.", "en": "Landing at Brest: Portuguese infantry on the way to the station."}, "Wikimedia Commons"], ["brest2", {"pt": "Tropas portuguesas atravessam Brest.", "fr": "Les troupes portugaises traversent Brest.", "en": "Portuguese troops marching through Brest."}, "Wikimedia Commons"], ["bayonet", {"pt": "Escola de infantaria de Marthes, 23 de junho de 1917: assalto a uma trincheira à baioneta.", "fr": "École d’infanterie de Marthes, 23 juin 1917 : assaut d’une tranchée à la baïonnette.", "en": "Infantry school at Marthes, 23 June 1917: clearing a trench with the bayonet."}, "IWM · J. W. Brooke"], ["gas", {"pt": "Marthes: exercício contra gás, de máscara.", "fr": "Marthes : exercice contre les gaz, masque sur le visage.", "en": "Marthes: anti-gas drill in masks."}, "IWM · J. W. Brooke"], ["lewis", {"pt": "Ma wis gun."}, "Vitor Oliveira · CC BY-SA 2.0"]], "camp": [["prisoners", {"pt": "Os primeiros prisioneiros portugueses chegam a Fournes, abril de 1918 (fotografia oficial alemã).", "fr": "Les premiers prisonniers portugais arrivent à Fournes, avril 1918 (photographie officielle allemande).", "en": "The first Portuguese prisoners arrive at Fournes, April 1918 (German official photograph)."}, "NARA"], ["gasmasks", {"pt": "Prisioneiros portugueses entregam as máscaras de gás, abril de 1918.", "fr": "Prisonniers portugais remettant leurs masques à gaz, avril 1918.", "en": "Portuguese prisoners handing in their gas masks, April 1918."}, "NARA"]]};

//commons.wikimedia.org/wiki/File:The_Portuguese_Expeditionary_Corps_on_the_Western_Front,_1917-1918_Q5564.jpg", "bread": "https://commons.wikimedia.org/wiki/File:Norton_de_Matos_provando_o_p%C3%A3o_dos_soldados_-_Portugal_na_Guerra_(15_Set._1917).png", "cruz": "https://commons.wikimedia.org/wiki/File:Homenagem_ao_Soldado_Milh%C3%B5es_-_Museu_Militar_-_Lisboa_-_Portugal_(50160703807).jpg", "prisoners": "https://commons.wikimedia.org/wiki/File:The_battle_of_Armentieres._The_first_captured_Portugese_troops_arrive_in_Fournes._April_1918_-_NARA_-_17391698.jpg", "gasmasks": "https://commons.wikimedia.org/wiki/File:The_battle_of_Armentieres._A_troop_of_captured_Portugese_in_a_central_receiving_station_giving_up_their_gas_masks._April_1918_-_NARA_-_17391700.jpg", "uniform": "https://commons.wikimedia.org/wiki/File:Royal_Museum_of_the_Armed_Forces_(Brussels)._Uniform_from_the_Portuguese_Expeditionary_Corps.jpg", "milhais": "https://commons.wikimedia.org/wiki/File:An%C3%ADbal_Augusto_Milhais_(Condecora%C3%A7%C3%A3o).PNG", "stokes": "https://commons.wikimedia.org/wiki/File:The_Portuguese_Expeditionary_Corps_on_the_Western_Front,_1917-1918_Q6440.jpg", "tamagnini": "https://commons.wikimedia.org/wiki/File:The_Portuguese_Expeditionary_Corps_on_the_Western_Front,_1917-1918_Q7792.jpg", "medical": "https://commons.wikimedia.org/wiki/File:Servi%C3%A7os_M%C3%A9dicos_do_Corpo_Expedicion%C3%A1rio_Portugu%C3%AAs,_na_1.%C2%AA_Guerra_Mundial_(foto_de_Arnaldo_Garc%C3%AAs).png", "decor": "https://commons.wikimedia.org/wiki/File:Na_frente_portuguesa,_o_General_Gomes_da_Costa_condecorando_pra%C3%A7as_com_a_Cruz_de_Guerra_-_Ilustra%C3%A7%C3%A3o_Portugueza_(22Jul1918).png"};
const MAPT={"pt": {"h": "A viagem", "p": "Percurso aproximado: de comboio da Burga a Lisboa, de navio até Brest, de comboio até à Flandres. Os três prisioneiros passaram por Lille e foram levados para campos na Alemanha. O regresso variou de homem para homem; a linha cinzenta é só indicativa.", "k": ["Comboio", "Navio", "Setor da frente", "Cativeiro", "Regresso, 1919"]}, "fr": {"h": "Le voyage", "p": "Itinéraire approximatif : en train de Burga à Lisbonne, en bateau jusqu’à Brest, en train jusqu’en Flandre. Les trois prisonniers passèrent par Lille avant les camps d’Allemagne. Le retour varia selon les hommes ; la ligne grise n’est qu’indicative.", "k": ["Train", "Navire", "Secteur du front", "Captivité", "Retour, 1919"]}, "en": {"h": "The journey", "p": "Approximate route: by train from Burga to Lisbon, by ship to Brest, by train to Flanders. The three prisoners went through Lille to camps in Germany. The way home differed from man to man; the grey line is only indicative.", "k": ["Train", "Ship", "Front sector", "Captivity", "Home, 1919"]}};
const BAT={"pt": {"h": "Os combates", "p": "As ações em que esteve o Regimento de Infantaria 10 e o que aconteceu em cada uma.", "i": [["4 abr. 1917", "Primeira entrada na linha", "Os primeiros batalhões portugueses entraram nas trincheiras do setor de Neuve-Chapelle, ao lado dos britânicos. Nesse dia morreu o primeiro soldado português na frente, António Gonçalves Curado.", ""], ["verão–outono 1917", "Os homens de Infantaria 10 chegam à frente", "A 2.ª Divisão entrou em linha entre o verão e o outono de 1917. A vida era de turnos: dias na primeira linha, depois nas linhas de apoio e de reserva, sob bombardeamentos, gás e patrulhas noturnas.", "Os soldados da Burga em Infantaria 10 tinham desembarcado em abril e maio de 1917."], ["5 nov. 1917", "O CEP assume o seu setor", "O Corpo português passou a comandar sozinho o seu setor de cerca de 11 km, com as duas divisões lado a lado, integrado no I Exército britânico.", ""], ["inverno 1917–1918", "Golpes de mão", "Os dois lados faziam incursões noturnas na trincheira inimiga para fazer prisioneiros e obter informações. Em março de 1918, com a ofensiva alemã a aproximar-se, os ataques contra as linhas portuguesas tornaram-se mais frequentes e violentos.", "José dos Santos foi louvado por se oferecer para um serviço perigoso, muito provavelmente uma destas ações."], ["6 abr. 1918", "A 1.ª Divisão sai da linha", "Exausto e sem reforços, o CEP foi reorganizado: a 1.ª Divisão retirou e a 2.ª ficou sozinha a guardar a frente, com mais terreno do que podia defender. Devia ser rendida a 9 de abril.", ""], ["9 abr. 1918", "Batalha de La Lys", "A ofensiva alemã «Georgette» começou às 4h15 com um bombardeamento de mais de quatro horas, com gás. A infantaria alemã avançou no nevoeiro e envolveu as trincheiras. Focos de resistência, como em La Couture, aguentaram até à tarde. O CEP perdeu cerca de 7 500 homens entre mortos, feridos e prisioneiros.", "Faustino, Francisco António e Cândido foram feitos prisioneiros. Os boletins dos outros oito não os dão como desaparecidos nem feridos."], ["abr.–set. 1918", "Depois da derrota", "Os sobreviventes foram reagrupados na retaguarda; muitos trabalharam para os britânicos a abrir trincheiras de reserva e a reparar estradas.", ""], ["out.–nov. 1918", "O avanço final", "Alguns batalhões portugueses reconstituídos voltaram à frente ao lado dos britânicos na ofensiva final, avançando para leste em direção ao Escalda até ao armistício de 11 de novembro.", "Felisberto passou a Infantaria 23 a 31 de outubro de 1918."]]}, "fr": {"h": "Les combats", "p": "Les actions auxquelles prit part le 10ᵉ régiment d’infanterie, et ce qui se passa dans chacune.", "i": [["4 avr. 1917", "Première montée en ligne", "Les premiers bataillons portugais entrèrent dans les tranchées du secteur de Neuve-Chapelle, aux côtés des Britanniques. Ce jour-là mourut le premier soldat portugais au front, António Gonçalves Curado.", ""], ["été–automne 1917", "Le 10ᵉ d’infanterie monte au front", "La 2ᵉ division prit place en ligne entre l’été et l’automne 1917. La vie suivait un roulement : des jours en première ligne, puis en soutien et en réserve, sous les bombardements, les gaz et les patrouilles de nuit.", "Les soldats de Burga du 10ᵉ d’infanterie avaient débarqué en avril et mai 1917."], ["5 nov. 1917", "Le CEP prend son secteur", "Le corps portugais commanda désormais seul son secteur d’environ 11 km, ses deux divisions côte à côte, au sein de la 1ʳᵉ armée britannique.", ""], ["hiver 1917–1918", "Coups de main", "Les deux camps lançaient des raids de nuit dans la tranchée adverse pour faire des prisonniers et du renseignement. En mars 1918, à l’approche de l’offensive allemande, les attaques contre les lignes portugaises se firent plus fréquentes et plus violentes.", "José dos Santos fut cité pour s’être porté volontaire pour une mission dangereuse, très probablement l’une de ces actions."], ["6 avr. 1918", "La 1ʳᵉ division quitte la ligne", "Épuisé et sans renforts, le CEP fut réorganisé : la 1ʳᵉ division se retira et la 2ᵉ resta seule à tenir le front, sur plus de terrain qu’elle ne pouvait en défendre. Elle devait être relevée le 9 avril.", ""], ["9 avr. 1918", "Bataille de la Lys", "L’offensive allemande « Georgette » commença à 4 h 15 par plus de quatre heures de bombardement, avec des gaz. L’infanterie allemande avança dans le brouillard et encercla les tranchées. Des îlots de résistance, comme à La Couture, tinrent jusqu’à l’après-midi. Le CEP perdit environ 7 500 hommes, tués, blessés ou prisonniers.", "Faustino, Francisco António et Cândido furent faits prisonniers. Les fiches des huit autres ne les disent ni disparus ni blessés."], ["avr.–sept. 1918", "Après la défaite", "Les survivants furent regroupés à l’arrière ; beaucoup travaillèrent pour les Britanniques à creuser des tranchées de réserve et à réparer les routes.", ""], ["oct.–nov. 1918", "L’avance finale", "Quelques bataillons portugais reconstitués retournèrent au front avec les Britanniques pour l’offensive finale, avançant vers l’est en direction de l’Escaut jusqu’à l’armistice du 11 novembre.", "Felisberto passa au 23ᵉ d’infanterie le 31 octobre 1918."]]}, "en": {"h": "The fighting", "p": "The actions the 10th Infantry Regiment took part in, and what happened in each.", "i": [["4 Apr 1917", "First into the line", "The first Portuguese battalions went into the trenches of the Neuve-Chapelle sector alongside the British. That day the first Portuguese soldier was killed at the front, António Gonçalves Curado.", ""], ["summer–autumn 1917", "The 10th Infantry goes up the line", "The 2nd Division went into the line between summer and autumn 1917. Life ran in turns: days in the front line, then in support and reserve, under shelling and gas, with patrols at night.", "The Burga men of the 10th Infantry had landed in April and May 1917."], ["5 Nov 1917", "The CEP takes over its own sector", "The Portuguese Corps now held its own sector of about 11 km on its own, its two divisions side by side, within the British First Army.", ""], ["winter 1917–1918", "Trench raids", "Both sides raided each other’s trenches at night to take prisoners and gather information. In March 1918, as the German offensive drew near, attacks on the Portuguese line grew more frequent and heavier.", "José dos Santos was commended for volunteering for a dangerous task, very probably one of these actions."], ["6 Apr 1918", "The 1st Division leaves the line", "Worn out and without reinforcements, the CEP was reorganised: the 1st Division was withdrawn and the 2nd was left alone to hold the front, with more ground than it could defend. It was due to be relieved on 9 April.", ""], ["9 Apr 1918", "Battle of the Lys", "The German “Georgette” offensive opened at 4.15 a.m. with more than four hours of shelling, including gas. German infantry advanced in the fog and surrounded the trenches. Pockets of resistance, as at La Couture, held out into the afternoon. The CEP lost about 7,500 men killed, wounded or captured.", "Faustino, Francisco António and Cândido were taken prisoner. The other eight men’s cards do not record them as missing or wounded."], ["Apr–Sep 1918", "After the defeat", "The survivors were regrouped behind the lines; many worked for the British digging reserve trenches and mending roads.", ""], ["Oct–Nov 1918", "The final advance", "Some rebuilt Portuguese battalions went back into the line with the British for the final offensive, pushing east towards the Scheldt until the Armistice on 11 November.", "Felisberto moved to the 23rd Infantry on 31 October 1918."]]}};
const HON={"pt": {"h": "Louvores, castigos e medalhas", "html": "<p>Nos boletins dos onze há um só louvor: José dos Santos, promovido a primeiro-cabo, foi louvado por se oferecer como voluntário para um serviço perigoso. Manuel Maria tem um castigo registado. Nos outros não há louvores nem castigos anotados.</p><p>Todos tinham direito à medalha comemorativa das campanhas do Exército Português, com a legenda «França 1917–1918», e à Medalha da Vitória dos Aliados.</p>{MED}<h3>Aníbal Milhais, o «Soldado Milhões»</h3><p>Aníbal Augusto Milhais, nascido em Valongo (Murça) a 9 de julho de 1895, era metralhador numa secção de metralhadoras de Infantaria 15. A 9 de abril de 1918, quase sozinho com a sua metralhadora Lewis, a que chamava «Luísa», cobriu a retirada de soldados portugueses e escoceses, e depois andou dias perdido atrás das linhas alemãs; mais tarde salvou um major escocês de um pântano. O seu comandante, Ferreira do Amaral, ter-lhe-á dito: «Tu és Milhais, mas vales milhões». Foi o único soldado raso português a receber a Ordem da Torre e Espada.</p><p class=\"burga\">Milhais era de Murça, a uns 50 km da Burga, e combateu a 9 de abril no mesmo setor da 2.ª Divisão que os homens de Infantaria 10. Podem ter-se cruzado, mas nenhum documento o prova.</p>"}, "fr": {"h": "Citations, punitions et médailles", "html": "<p>Les fiches des onze ne portent qu’une seule citation : José dos Santos, promu caporal, fut cité pour s’être porté volontaire pour une mission dangereuse. Manuel Maria a une punition inscrite. Les autres n’ont ni citation ni punition notée.</p><p>Tous avaient droit à la médaille commémorative des campagnes de l’armée portugaise, avec l’inscription « France 1917–1918 », et à la médaille interalliée de la Victoire.</p>{MED}<h3>Aníbal Milhais, le « soldat Millions »</h3><p>Aníbal Augusto Milhais, né à Valongo (Murça) le 9 juillet 1895, était mitrailleur dans une section de mitrailleuses du 15ᵉ d’infanterie. Le 9 avril 1918, presque seul avec sa mitrailleuse Lewis, qu’il appelait « Luísa », il couvrit la retraite de soldats portugais et écossais, puis erra plusieurs jours derrière les lignes allemandes ; plus tard, il sauva un major écossais d’un marécage. Son commandant, Ferreira do Amaral, lui aurait dit : « Tu t’appelles Milhais, mais tu vaux des millions ». Il fut le seul simple soldat portugais décoré de l’ordre de la Tour et de l’Épée.</p><p class=\"burga\">Milhais était de Murça, à une cinquantaine de kilomètres de Burga, et combattit le 9 avril dans le même secteur de la 2ᵉ division que les hommes du 10ᵉ d’infanterie. Ils ont pu se croiser, mais aucun document ne le prouve.</p>"}, "en": {"h": "Commendations, punishments and medals", "html": "<p>The eleven men’s cards carry just one commendation: José dos Santos, promoted to corporal, was commended for volunteering for a dangerous task. Manuel Maria has one punishment recorded. The others have no commendation or punishment noted.</p><p>All were entitled to the Portuguese Army campaign medal with the clasp “France 1917–1918” and to the Allied Victory Medal.</p>{MED}<h3>Aníbal Milhais, “Soldier Millions”</h3><p>Aníbal Augusto Milhais, born at Valongo (Murça) on 9 July 1895, was a machine-gunner in a machine-gun section of the 15th Infantry. On 9 April 1918, almost alone with his Lewis gun, which he called “Luísa”, he covered the retreat of Portuguese and Scottish soldiers, then spent days lost behind the German lines; later he rescued a Scottish major from a marsh. His commander, Ferreira do Amaral, is said to have told him: “Your name is Milhais, but you are worth millions.” He was the only Portuguese private to receive the Order of the Tower and Sword.</p><p class=\"burga\">Milhais came from Murça, about 50 km from Burga, and fought on 9 April in the same 2nd Division sector as the 10th Infantry men. They may have crossed paths, but no record proves it.</p>"}};

function figs(id,l){const a=PH[id]; if(!a) return ""; return `<div class="phs">`+a.map(([k,cap,cr])=>`<figure class="ph"><img src="img/${k}.jpg" alt="${esc(cap[l])}" loading="lazy"><figcaption>${esc(cap[l])} <a href="${esc(PHU[k]||"")}" target="_blank" rel="noopener">${esc(cr)}</a></figcaption></figure>`).join("")+`</div>`;}
const READ=[["https://ahm-exercito.defesa.gov.pt/", "Arquivo Histórico Militar (Lisboa)", {"pt": "boletins individuais de todos os militares do CEP, pesquisáveis por nome.", "fr": "fiches individuelles de tous les militaires du CEP, consultables par nom.", "en": "individual service cards for every CEP soldier, searchable by name."}], ["https://grandeguerre.icrc.org/", "Comité Internacional da Cruz Vermelha – prisioneiros 1914–1918", {"pt": "fichas dos prisioneiros portugueses, organizadas por apelido.", "fr": "fiches des prisonniers portugais, classées par nom.", "en": "cards for Portuguese prisoners of war, filed by surname."}], ["https://www.rtp.pt/noticias/portugal-na-1-grande-guerra/as-trincheiras-portuguesas-no-epistolario-dos-soldados-entrevista-com-filipe-menezes_es888162", "RTP – As trincheiras portuguesas no epistolário dos soldados", {"pt": "entrevista com o historiador Filipe Ribeiro de Meneses sobre as cartas dos soldados.", "fr": "entretien avec l’historien Filipe Ribeiro de Meneses sur les lettres des soldats.", "en": "interview with historian Filipe Ribeiro de Meneses on the soldiers’ letters."}], ["https://www.rtp.pt/noticias/primeira-guerra-mundial/um-eplogo-como-sobreviveram-os-prisioneiros-portugueses_n1060277", "RTP – Como sobreviveram os prisioneiros portugueses", {"pt": "a vida nos campos alemães.", "fr": "la vie dans les camps allemands.", "en": "life in the German camps."}], ["https://dl.uc.pt/bitstream/10316.2/45000/1/a_comemoracao_da_grande_guerra_em_portugal.pdf", "F. Ribeiro de Meneses – A comemoração da Grande Guerra em Portugal, 1919–1926", {"pt": "o regresso do CEP e a memória da guerra.", "fr": "le retour du CEP et la mémoire de la guerre.", "en": "the CEP’s return and how the war was remembered."}], ["https://dl.uc.pt/bitstream/10316.2/46354/1/marte_e_venus._notas_para_o_estudo_da_mentalidade.pdf", "Marte e Vénus – a mentalidade do soldado português na Flandres", {"pt": "estudo de 195 cartas de soldados, 1917–1918.", "fr": "étude de 195 lettres de soldats, 1917–1918.", "en": "a study of 195 soldiers’ letters, 1917–1918."}], ["https://hemerotecadigital.cm-lisboa.pt/RaridadesBibliograficas/MemoriasdumExpedicionarioaFranca_HumbertodeAlmeida_IGM_rarbib/MemoriasdumExpedicionarioaFranca_HumbertodeAlmeida_IGM_rarbib_master/MemoriasdumExpedicionarioaFranca.pdf", "Humberto de Almeida – Memórias dum Expedicionário a França", {"pt": "memórias de um combatente, em linha na Hemeroteca de Lisboa.", "fr": "souvenirs d’un combattant, en ligne à l’Hemeroteca de Lisbonne.", "en": "a veteran’s memoir, online at the Lisbon newspaper library."}], ["https://hemerotecadigital.cm-lisboa.pt/RaridadesBibliograficas/AMaltadasTrincheiras_AndreBrun_IGM_rarbib/AMaltadasTrincheiras_AndreBrun_master/AMaltadasTrincheiras.pdf", "André Brun – A Malta das Trincheiras", {"pt": "crónicas da vida nas trincheiras, escritas por um oficial do CEP.", "fr": "chroniques de la vie des tranchées, par un officier du CEP.", "en": "sketches of trench life by a CEP officer."}], ["https://en.wikipedia.org/wiki/An%C3%ADbal_Milhais", "Aníbal Milhais – Wikipedia", {"pt": "a história do Soldado Milhões.", "fr": "l’histoire du soldat Millions.", "en": "the story of Soldier Millions."}], ["https://commons.wikimedia.org/wiki/Category:Portuguese_Expeditionary_Corps_(World_War_I)", "Wikimedia Commons – Corpo Expedicionário Português", {"pt": "centenas de fotografias do CEP, livres de direitos.", "fr": "des centaines de photos libres de droits du CEP.", "en": "hundreds of free-to-use CEP photographs."}], ["https://ligacombatentes.org/", "Liga dos Combatentes", {"pt": "associação dos antigos combatentes, com núcleo em Bragança.", "fr": "association des anciens combattants, avec une section à Bragança.", "en": "the veterans’ association, with a branch in Bragança."}]];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function render(l){
  const t=T[l]; document.documentElement.lang=l;
  for(const k of ["eyebrow","h1","lead","lead2","legend"]) document.getElementById(k).textContent=t[k];
  document.getElementById("facts").innerHTML=t.facts.map(([n,w])=>`<li><b>${n}</b>${esc(w)}</li>`).join("");
  document.getElementById("h-src").textContent=t.hsrc; document.getElementById("p-src").textContent=t.psrc;
  document.getElementById("p-more").textContent=t.pmore; document.getElementById("h-read").textContent=t.hread; document.getElementById("h-share").textContent=t.hshare;
  document.getElementById("reading").innerHTML=READ.map(([u,n,d])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a> – ${esc(d[l])}</li>`).join(""); document.getElementById("copy").textContent=t.copy; document.getElementById("copied").textContent="";
  document.getElementById("grid").innerHTML=S.map(s=>{
    const life=[s.b?`${t.born} ${d(s.b,l)}`:"",s.x?`${t.died} ${d(s.x,l)}${s.xp?" · "+esc(s.xp):""}`:""].filter(Boolean).join(" — ");
    return `<article class="card${s.fam?" fam":""}">
      <div class="top"><span>${esc(s.n[l])}</span>${s.fam?`<span>${t.fam}</span>`:""}</div>
      <h2>${esc(s.name)}</h2>
      <p class="born">${life||"Burga"}</p>
      <dl><dt>${t.fields.son}</dt><dd>${esc(s.p)}</dd>${s.u?`<dt>${t.fields.unit}</dt><dd>${esc(s.u)}</dd>`:""}
      <dt>${t.fields.out}</dt><dd>Lisboa, ${d(s.o,l)}</dd><dt>${t.fields.back}</dt><dd>${d(s.r,l)}</dd></dl>
      <p class="role"><b>${ROLELBL[l]}</b>${esc((ROLE[s.name]||ROLE._inf)[l])}</p>
      <p class="fate">${s.pow?`<span class="pow">${t.pow}</span><br>`:""}${esc(s.f[l])}</p>
      ${s.rel?`<p class="rel"><b>★</b> ${esc(s.rel[l])}</p>`:""}
      <span class="ref">AHM ${esc(s.ref)}</span></article>`;}).join("");
  const st=STORY[l];
  document.getElementById("h-story").textContent=st.h; document.getElementById("p-story").textContent=st.intro;
  document.getElementById("toc").innerHTML=st.ch.map(c=>`<a href="#${c[0]}">${esc(c[2])}</a>`).join("");
  document.getElementById("story").innerHTML=st.ch.map(c=>`<article class="chap" id="${c[0]}"><div class="when">${esc(c[1])}</div><div><h3>${esc(c[2])}</h3><p>${esc(c[3])}</p>${c[4]?`<p class="burga">${esc(c[4])}</p>`:""}${figs(c[0],l)}</div></article>`).join("");
  const mt=MAPT[l]; document.getElementById("h-map").textContent=mt.h; document.getElementById("p-map").textContent=mt.p;
  document.getElementById("mapkey").innerHTML=mt.k.map((w,i)=>`<li><i style="${KEY[i]}"></i>${esc(w)}</li>`).join("");
  const bt=BAT[l]; document.getElementById("h-bat").textContent=bt.h; document.getElementById("p-bat").textContent=bt.p;
  document.getElementById("bat").innerHTML=bt.i.map(b=>`<li><div class="when">${esc(b[0])}</div><div><h3>${esc(b[1])}</h3><p>${esc(b[2])}</p>${b[3]?`<p class="burga">${esc(b[3])}</p>`:""}</div></li>`).join("");
  document.getElementById("h-hon").textContent=HON[l].h; document.getElementById("hon").innerHTML=HON[l].html.replace("{MED}",figs("hon",l));
  for(const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", b.dataset.l===l?"true":"false");
}
let LANG="pt";
function fromHash(){ const h=(location.hash||"").slice(1); return T[h]?h:null; }
LANG=fromHash()||LANG; render(LANG);
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button[data-l]"); if(!b) return; LANG=b.dataset.l; render(LANG); try{history.replaceState(null,"","#"+LANG);}catch(_){location.hash=LANG;}});
window.addEventListener("hashchange",()=>{const h=fromHash(); if(h&&h!==LANG){LANG=h;render(LANG);}});
document.getElementById("copy").addEventListener("click",()=>{const st=document.getElementById("copied"); const url=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>{st.textContent=T[LANG].copied;},()=>{st.textContent=T[LANG].copyfail;});} else st.textContent=T[LANG].copyfail;});
</script>

</body>
</html>
